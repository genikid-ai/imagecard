<body><main><h1>圖址雲端隱私權政策</h1><p>最後更新：2026 年 8 月 21 日</p><h2>帳號資料</h2><p>本工具使用 Google 登入確認使用權限。登入憑證僅用於當次驗證，不會儲存在 GitHub Pages。</p><h2>上傳內容</h2><p>使用者主動選取的圖片會發布至指定 GitHub 儲存庫，並備份至指定 Google Drive 資料夾。公開圖片網址可供闖關遊戲使用。</p><h2>資料分享</h2><p>除了完成上述圖片發布與備份之外，本工具不會將帳號資料販售或用於廣告。</p><h2>管理與刪除</h2><p>圖片與資料夾可由網站管理者直接在 GitHub 或 Google Drive 中管理及刪除。</p><p><a href="./">返回圖址雲端</a></p></main></body>
